# =============================================================================
# Dependabot Configuration
# =============================================================================
# Monitors Docker base images for updates
# Combined with docker-maintenance.yml workflow for auto-merge and release
# =============================================================================

version: 2
updates:
  # Docker base image updates
  - package-ecosystem: "docker"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"
      include: "scope"
    open-pull-requests-limit: 5

  # Python application dependencies (Flask, gunicorn, Flask-Limiter)
  # Not auto-merged — docker-maintenance.yml only auto-merges Dockerfile updates,
  # so these PRs are reviewed manually. The PR build (incl. the pytest gate)
  # validates each one before it can be merged.
  - package-ecosystem: "pip"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "python"
      - "dependabot"
    commit-message:
      prefix: "fix(deps)"
      include: "scope"
    open-pull-requests-limit: 5

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    commit-message:
      prefix: "chore(ci)"
