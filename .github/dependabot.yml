# =============================================================================
# Dependabot Configuration
# =============================================================================
# Monitors the Docker base image, the Python requirements and GitHub Actions
# Combined with docker-maintenance.yml workflow for auto-merge and release
# (GitHub Actions updates are always merged by hand)
# =============================================================================

version: 2
updates:
  # Docker base image updates
  - package-ecosystem: "docker"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"
      include: "scope"
    open-pull-requests-limit: 5

  # Python application dependencies (Flask, gunicorn, Flask-Limiter) and the
  # test requirements (pytest, pytest-mock)
  # Patch updates are auto-merged by docker-maintenance.yml once the PR build
  # of docker-release.yml (it installs both requirements files and runs the
  # pytest gate) has passed. Minor and major updates stay open for review.
  - package-ecosystem: "pip"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "python"
      - "dependabot"
    commit-message:
      prefix: "fix(deps)"
      include: "scope"
    open-pull-requests-limit: 5

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    commit-message:
      prefix: "chore(ci)"
